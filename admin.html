<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel do site · CEA Arco-Íris</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0E6B30; --verde-claro:#E6F2E8; --sol:#F6B70E; --fundo:#F4F7F4; --cartao:#FFFFFF;
  --tinta:#16301E; --suave:#55685A; --linha:#D5E2D7; --erro:#B42318; --erro-fundo:#FDECEA; --ok:#0E6B30;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --texto:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --verde:#4CC274; --verde-claro:#18301F; --fundo:#0F1A13; --cartao:#17271C; --tinta:#E8F1EA; --suave:#A9BCAD; --linha:#2A3F30;
    --erro:#FF8A80; --erro-fundo:#3A1714; --ok:#4CC274; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --verde:#4CC274; --verde-claro:#18301F; --fundo:#0F1A13; --cartao:#17271C; --tinta:#E8F1EA; --suave:#A9BCAD; --linha:#2A3F30;
  --erro:#FF8A80; --erro-fundo:#3A1714; --ok:#4CC274; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--texto);font-size:16px;line-height:1.5;background:var(--fundo);color:var(--tinta);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px;border-radius:6px}
.oculto{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--linha);background:var(--cartao);font-weight:700;cursor:pointer;text-decoration:none;color:var(--tinta)}
.btn:hover{border-color:var(--verde)}
.btn-primario{background:var(--verde);border-color:var(--verde);color:#FFFFFF}
:root[data-theme="dark"] .btn-primario{color:#0F1A13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primario{color:#0F1A13}}
.btn-perigo{color:var(--erro)}
.btn-pequeno{min-height:36px;padding:4px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{background:var(--cartao);border:1px solid var(--linha);border-radius:20px;padding:32px;width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.login img{width:84px;height:84px;margin:0 auto}
.login h1{text-align:center;font-size:1.6rem;color:var(--verde)}
.login p{margin:0;text-align:center;color:var(--suave)}
.link{background:none;border:0;color:var(--verde);font-weight:700;cursor:pointer;padding:6px;text-decoration:underline}

/* Layout */
.barra{position:sticky;top:0;z-index:20;background:var(--cartao);border-bottom:1px solid var(--linha)}
.barra .in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.barra img{width:42px;height:42px}
.barra h1{font-size:1.25rem;color:var(--verde)}
.barra small{display:block;color:var(--suave);font-size:.85rem}
.barra .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.corpo{max-width:1200px;margin:0 auto;padding:24px 20px;display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.abas{position:sticky;top:86px;display:flex;flex-direction:column;gap:4px}
.abas button{all:unset;cursor:pointer;padding:11px 14px;border-radius:10px;font-weight:700;color:var(--suave)}
.abas button:hover{background:var(--cartao);color:var(--tinta)}
.abas button[aria-selected="true"]{background:var(--verde-claro);color:var(--verde)}
.abas button:focus-visible{outline:3px solid var(--sol)}
@media (max-width:820px){
  .corpo{grid-template-columns:1fr;gap:16px;padding-top:12px}
  .abas{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .abas button{white-space:nowrap}
  .barra .acoes .btn span{display:none}
}
.painel{background:var(--cartao);border:1px solid var(--linha);border-radius:18px;padding:28px}
.painel > h2{font-size:1.5rem;margin-bottom:4px}
.painel > .desc{color:var(--suave);margin:0 0 22px}
@media (max-width:560px){.painel{padding:20px}}

/* Campos */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.campo > label{font-weight:700}
.campo .ajuda{color:var(--suave);font-size:.88rem}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=url],textarea{width:100%;padding:11px 13px;border:1.5px solid var(--linha);border-radius:10px;background:var(--fundo)}
input:focus,textarea:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--verde) 20%,transparent)}
textarea{min-height:96px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--verde)}
.cor{display:flex;align-items:center;gap:12px}
.cor input[type=color]{width:56px;height:44px;border:1.5px solid var(--linha);border-radius:10px;padding:2px;background:var(--fundo);cursor:pointer}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:640px){.grade2{grid-template-columns:1fr}}

/* Repetidor */
.item{border:1.5px solid var(--linha);border-radius:14px;padding:18px 18px 4px;margin-bottom:14px;background:var(--fundo)}
.item-topo{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.item-topo b{font-family:var(--display);font-size:1.05rem;margin-right:auto}

/* Imagem (logo) */
.logo-campo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-campo img{width:84px;height:84px;object-fit:contain;border-radius:12px;background:var(--fundo);border:1px solid var(--linha)}

/* Fotos */
.soltar{display:block;border:2px dashed var(--linha);border-radius:16px;padding:28px;text-align:center;background:var(--fundo);cursor:pointer}
.soltar.sobre{border-color:var(--verde);background:var(--verde-claro)}
.soltar b{display:block;font-family:var(--display);font-size:1.2rem}
.soltar span{color:var(--suave)}
.progresso{margin-top:12px;font-weight:700;color:var(--verde)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:22px}
.foto{border:1.5px solid var(--linha);border-radius:14px;overflow:hidden;background:var(--fundo);display:flex;flex-direction:column}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.foto.escondida img{opacity:.4}
.foto .in{padding:12px;display:flex;flex-direction:column;gap:10px}
.foto .linha{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vazio{color:var(--suave);text-align:center;padding:24px}

/* Barra de salvar */
.salvar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--cartao);border-top:1px solid var(--linha);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.salvar .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:flex-end}
.salvar .estado{margin-right:auto;font-weight:700;color:var(--suave)}
.salvar .estado.pendente{color:#9A6700}
:root[data-theme="dark"] .salvar .estado.pendente{color:var(--sol)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .salvar .estado.pendente{color:var(--sol)}}
.msg{padding:12px 14px;border-radius:10px;font-weight:600}
.msg.erro{background:var(--erro-fundo);color:var(--erro)}
.msg.ok{background:var(--verde-claro);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--fundo);padding:12px 20px;border-radius:12px;font-weight:700;z-index:40;max-width:90vw}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="tela-login">
  <form id="form-login" novalidate>
    <img src="logo.png" alt="">
    <h1>Painel do site</h1>
    <p>Entre com o e-mail e a senha de editor do site.</p>
    <div class="campo"><label for="l-email">E-mail</label><input type="email" id="l-email" autocomplete="username" required></div>
    <div class="campo"><label for="l-senha">Senha</label><input type="password" id="l-senha" autocomplete="current-password" required></div>
    <div class="msg erro oculto" id="l-erro" role="alert"></div>
    <button class="btn btn-primario" type="submit" id="l-entrar">Entrar</button>
    <button class="link" type="button" id="l-esqueci">Esqueci minha senha</button>
  </form>
</div>

<!-- SEM PERMISSÃO -->
<div class="login oculto" id="tela-sem-permissao">
  <form onsubmit="return false">
    <img src="logo.png" alt="">
    <h1>Sem permissão para editar</h1>
    <p id="sp-texto"></p>
    <button class="btn" type="button" id="sp-sair">Sair</button>
  </form>
</div>

<!-- PAINEL -->
<div class="oculto" id="tela-painel">
  <header class="barra">
    <div class="in">
      <img src="logo.png" alt="">
      <div><h1>Painel do site</h1><small id="quem"></small></div>
      <div class="acoes">
        <a class="btn" href="index.html" target="_blank" rel="noopener" aria-label="Ver site">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          <span>Ver site</span>
        </a>
        <button class="btn" type="button" id="sair">Sair</button>
      </div>
    </div>
  </header>
  <div class="corpo">
    <nav class="abas" role="tablist" aria-label="Seções do painel" id="abas"></nav>
    <main class="painel" id="painel" role="tabpanel"></main>
  </div>
  <div class="salvar">
    <div class="in">
      <span class="estado" id="estado">Tudo salvo</span>
      <button class="btn" type="button" id="descartar" disabled>Desfazer alterações</button>
      <button class="btn btn-primario" type="button" id="salvar" disabled>Salvar alterações</button>
    </div>
  </div>
</div>

<div class="toast oculto" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="comum.js"></script>
<script>
(function(){
const { padrao, mesclar, esc, COL } = CEA;
const db = CEA.iniciarFirebase();
if (!db) {
  document.body.innerHTML = '<div class="login"><form><h1>Falta configurar o Firebase</h1><p>Abra o arquivo comum.js e cole a configuração do projeto Firebase do site no lugar de "COLE_AQUI".</p></form></div>';
  return;
}
const auth = firebase.auth();
const $ = s => document.querySelector(s);

/* ---------- Estrutura dos formulários ---------- */
const ABAS = [
  { id:"geral", nome:"Geral", desc:"Nome, lema e logo da escola.", campos:[
    { k:"escola.nome", r:"Nome completo da escola" },
    { k:"escola.nomeCurto", r:"Nome curto", a:"Aparece no topo do site, ao lado do logo." },
    { k:"escola.slogan", r:"Lema" },
    { k:"escola.fundacao", r:"Ano de fundação", t:"number", a:"Usado para calcular os anos de história mostrados no início." },
    { k:"escola.logo", r:"Logo", t:"logo" }
  ]},
  { id:"contato", nome:"Contato e links", desc:"Como as famílias falam com a escola e os links dos parceiros.", campos:[
    { grupo:true, campos:[
      { k:"contato.whatsapp", r:"WhatsApp principal (só números)", a:"Usado nos botões do site. Com 55 e DDD. Ex.: 5571991629960" },
      { k:"contato.whatsappExibicao", r:"WhatsApp principal como aparece no site", a:"O mesmo número de cima, formatado. Ex.: (71) 99162-9960" },
      { k:"contato.telefone", r:"Segundo telefone", a:"Ex.: (71) 3565-5806. Deixe vazio para esconder." },
      { k:"contato.telefoneWhats", r:"O segundo telefone também é WhatsApp", t:"check" },
      { k:"contato.instagram", r:"Instagram", a:"Sem o @" },
      { k:"contato.endereco", r:"Endereço" },
      { k:"contato.bairroCidade", r:"Bairro e cidade" }
    ]},
    { k:"contato.horario", r:"Horário de atendimento", a:"Ex.: Segunda a sexta, das 7h às 18h. Deixe vazio para esconder." },
    { k:"contato.mensagemWhatsapp", r:"Mensagem que já vem escrita no WhatsApp", t:"textarea" },
    { k:"links.matricula", r:"Link da pré-matrícula online", t:"url", a:"Link do formulário do seu sistema. Vazio = o botão leva ao WhatsApp." },
    { k:"links.classapp", r:"Link do ClassApp", t:"url" },
    { k:"links.isaac", r:"Link do Isaac", t:"url" }
  ]},
  { id:"inicio", nome:"Início", desc:"A primeira parte do site, que todo mundo vê.", campos:[
    { k:"hero.titulo", r:"Título principal" },
    { k:"hero.texto", r:"Texto de apresentação", t:"textarea" },
    { k:"hero.mostrarAnos", r:"Mostrar o sol com os anos de história", t:"check" },
    { k:"hero.faixa", r:"Faixa amarela", t:"lista", a:"Separe os itens por vírgula. Ex.: Manhã, Tarde, Integral" },
    { k:"contatoSecao.titulo", r:"Título da seção de contato" },
    { k:"contatoSecao.intro", r:"Texto da seção de contato", t:"textarea" }
  ]},
  { id:"etapas", nome:"Etapas", desc:"As etapas de ensino que a escola oferece.", campos:[
    { k:"etapas.titulo", r:"Título da seção" },
    { k:"etapas.intro", r:"Texto de introdução", t:"textarea" },
    { k:"etapas.itens", r:"Etapa", t:"rep", novo:{ selo:"", titulo:"Nova etapa", texto:"" }, sub:[
      { k:"titulo", r:"Nome" }, { k:"selo", r:"Selo", a:"Ex.: a partir de 4 meses" }, { k:"texto", r:"Descrição", t:"textarea" }
    ]}
  ]},
  { id:"parceiros", nome:"Diferenciais", desc:"Parceiros e diferenciais. Os marcados como destaque aparecem maiores, em verde.", campos:[
    { k:"parceiros.titulo", r:"Título da seção" },
    { k:"parceiros.intro", r:"Texto de introdução", t:"textarea" },
    { k:"parceiros.itens", r:"Diferencial", t:"rep", novo:{ nome:"", titulo:"Novo diferencial", texto:"", destaque:false }, sub:[
      { k:"titulo", r:"Título" }, { k:"nome", r:"Parceiro", a:"Ex.: Nave à Vela" }, { k:"texto", r:"Descrição", t:"textarea" }, { k:"destaque", r:"Destaque", t:"check" }
    ]}
  ]},
  { id:"historia", nome:"História", desc:"A história e a missão da escola.", campos:[
    { k:"historia.titulo", r:"Título da seção" },
    { grupo:true, campos:[
      { k:"historia.placa", r:"Texto da placa" },
      { k:"historia.placaLegenda", r:"Legenda da placa" }
    ]},
    { k:"historia.itens", r:"Momento", t:"rep", novo:{ marca:"", titulo:"", texto:"" }, sub:[
      { k:"marca", r:"Ano ou marco", a:"Curto. Ex.: 2001, Hoje" }, { k:"titulo", r:"Título" }, { k:"texto", r:"Texto", t:"textarea" }
    ]},
    { k:"historia.missaoTitulo", r:"Título do quadro amarelo" },
    { k:"historia.missao", r:"Texto do quadro amarelo", t:"textarea" },
    { k:"familias.titulo", r:"Título da seção Para as famílias" },
    { k:"familias.intro", r:"Texto da seção Para as famílias", t:"textarea" }
  ]},
  { id:"fotos", nome:"Fotos", desc:"Fotos da galeria. Elas são reduzidas automaticamente antes de enviar. Só publique fotos de crianças com autorização de uso de imagem dos responsáveis." },
  { id:"aviso", nome:"Aviso", desc:"Uma faixa no topo do site para recados importantes.", campos:[
    { k:"aviso.ativo", r:"Mostrar aviso no site", t:"check" },
    { k:"aviso.texto", r:"Texto do aviso" },
    { k:"aviso.link", r:"Link do “Saiba mais” (opcional)", t:"url" },
    { k:"galeria.titulo", r:"Título da galeria de fotos" },
    { k:"galeria.intro", r:"Texto da galeria de fotos", t:"textarea" }
  ]},
  { id:"aparencia", nome:"Seções e cores", desc:"Escolha o que aparece no site e as cores principais.", campos:[
    { k:"secoes.etapas", r:"Etapas", t:"check" },
    { k:"secoes.parceiros", r:"Diferenciais", t:"check" },
    { k:"secoes.historia", r:"Nossa história", t:"check" },
    { k:"secoes.galeria", r:"Galeria de fotos", t:"check" },
    { k:"secoes.familias", r:"Para as famílias", t:"check" },
    { k:"secoes.instagram", r:"Chamada do Instagram", t:"check" },
    { k:"secoes.contato", r:"Contato e mapa", t:"check" },
    { k:"cores.verde", r:"Cor principal", t:"cor" },
    { k:"cores.sol", r:"Cor de destaque", t:"cor" }
  ]}
];

/* ---------- Estado ---------- */
let dados = structuredClone(padrao), salvoJSON = JSON.stringify(dados), abaAtual = "geral";
const pegar = (o, c) => c.split(".").reduce((a, k) => a == null ? a : a[k], o);
function pôr(o, c, v){ const p = c.split("."); const u = p.pop(); p.reduce((a, k) => a[k] ??= {}, o)[u] = v; }
function marcarAlterado(){
  const pend = JSON.stringify(dados) !== salvoJSON;
  $("#estado").textContent = pend ? "Alterações não salvas" : "Tudo salvo";
  $("#estado").classList.toggle("pendente", pend);
  $("#salvar").disabled = !pend; $("#descartar").disabled = !pend;
}
function aviso(t){ const el = $("#toast"); el.textContent = t; el.classList.remove("oculto"); clearTimeout(aviso.t); aviso.t = setTimeout(() => el.classList.add("oculto"), 3200); }
window.addEventListener("beforeunload", e => { if (JSON.stringify(dados) !== salvoJSON) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- Login ---------- */
const erros = {
  "auth/invalid-credential":"E-mail ou senha incorretos.", "auth/wrong-password":"E-mail ou senha incorretos.",
  "auth/user-not-found":"E-mail ou senha incorretos.", "auth/invalid-email":"Digite um e-mail válido.",
  "auth/too-many-requests":"Muitas tentativas. Aguarde alguns minutos e tente de novo.",
  "auth/network-request-failed":"Sem conexão com a internet."
};
$("#form-login").addEventListener("submit", async e => {
  e.preventDefault();
  const el = $("#l-erro"); el.classList.add("oculto");
  $("#l-entrar").disabled = true; $("#l-entrar").textContent = "Entrando…";
  try { await auth.signInWithEmailAndPassword($("#l-email").value.trim(), $("#l-senha").value); }
  catch(err){ el.textContent = erros[err.code] || "Não foi possível entrar: " + err.message; el.classList.remove("oculto"); }
  $("#l-entrar").disabled = false; $("#l-entrar").textContent = "Entrar";
});
$("#l-esqueci").addEventListener("click", async () => {
  const email = $("#l-email").value.trim(), el = $("#l-erro");
  if (!email) { el.textContent = "Digite seu e-mail acima e toque em Esqueci minha senha de novo."; el.classList.remove("oculto"); return; }
  try { await auth.sendPasswordResetEmail(email); aviso("Enviamos um link para redefinir a senha em " + email); }
  catch(err){ el.textContent = erros[err.code] || err.message; el.classList.remove("oculto"); }
});
const sair = () => auth.signOut();
$("#sair").addEventListener("click", sair); $("#sp-sair").addEventListener("click", sair);

auth.onAuthStateChanged(async user => {
  ["#tela-login","#tela-painel","#tela-sem-permissao"].forEach(s => $(s).classList.add("oculto"));
  if (!user) { $("#tela-login").classList.remove("oculto"); return; }
  const email = (user.email || "").toLowerCase();
  let pode = false;
  try { pode = (await db.collection(COL.editores).doc(email).get()).exists; } catch(e) { pode = false; }
  if (!pode) {
    $("#sp-texto").textContent = `O e-mail ${email} ainda não está na lista de quem pode editar o site. Peça para o administrador incluir este e-mail na coleção "${COL.editores}" do Firebase.`;
    $("#tela-sem-permissao").classList.remove("oculto"); return;
  }
  $("#quem").textContent = email;
  $("#tela-painel").classList.remove("oculto");
  await carregar();
});

async function carregar(){
  try {
    const d = await db.collection(COL.conteudo).doc("conteudo").get();
    const salvo = d.exists ? d.data() : {};
    delete salvo.atualizadoEm; delete salvo.atualizadoPor;
    dados = mesclar(padrao, salvo);
  } catch(e){ aviso("Não consegui carregar o conteúdo: " + e.message); }
  salvoJSON = JSON.stringify(dados);
  montarAbas(); mostrar(abaAtual); marcarAlterado();
}

/* ---------- Abas ---------- */
function montarAbas(){
  $("#abas").innerHTML = ABAS.map(a => `<button role="tab" type="button" data-aba="${a.id}" aria-selected="${a.id === abaAtual}">${esc(a.nome)}</button>`).join("");
}
$("#abas").addEventListener("click", e => { const b = e.target.closest("[data-aba]"); if (b) mostrar(b.dataset.aba); });
function mostrar(id){
  abaAtual = id;
  document.querySelectorAll("#abas [data-aba]").forEach(b => b.setAttribute("aria-selected", b.dataset.aba === id));
  const aba = ABAS.find(a => a.id === id);
  const p = $("#painel");
  p.innerHTML = `<h2>${esc(aba.nome)}</h2><p class="desc">${esc(aba.desc)}</p>`;
  if (id === "fotos") return montarFotos(p);
  aba.campos.forEach(c => p.appendChild(criarCampo(c, dados, c.k)));
}

let seq = 0;
function criarCampo(c, alvo, caminho){
  if (c.grupo) { const g = document.createElement("div"); g.className = "grade2"; c.campos.forEach(x => g.appendChild(criarCampo(x, alvo, x.k))); return g; }
  const id = "c" + (++seq), wrap = document.createElement("div"); wrap.className = "campo";
  const val = pegar(alvo, caminho);
  const ajuda = c.a ? `<span class="ajuda" id="${id}-a">${esc(c.a)}</span>` : "";
  const desc = c.a ? ` aria-describedby="${id}-a"` : "";
  const t = c.t || "text";
  const muda = v => { pôr(alvo, caminho, v); marcarAlterado(); };

  if (t === "text" || t === "url" || t === "number") {
    wrap.innerHTML = `<label for="${id}">${esc(c.r)}</label><input id="${id}" type="${t === "number" ? "number" : "text"}"${t === "url" ? ' inputmode="url" placeholder="https://"' : ""} value="${esc(val)}"${desc}>${ajuda}`;
    wrap.querySelector("input").addEventListener("input", e => muda(t === "number" ? Number(e.target.value) : e.target.value));
  } else if (t === "textarea") {
    wrap.innerHTML = `<label for="${id}">${esc(c.r)}</label><textarea id="${id}"${desc}>${esc(val)}</textarea>${ajuda}`;
    wrap.querySelector("textarea").addEventListener("input", e => muda(e.target.value));
  } else if (t === "check") {
    wrap.innerHTML = `<label class="check"><input type="checkbox" ${val !== false && val ? "checked" : ""}> ${esc(c.r)}</label>${ajuda}`;
    wrap.querySelector("input").addEventListener("change", e => muda(e.target.checked));
  } else if (t === "lista") {
    wrap.innerHTML = `<label for="${id}">${esc(c.r)}</label><input id="${id}" type="text" value="${esc((val || []).join(", "))}"${desc}>${ajuda}`;
    wrap.querySelector("input").addEventListener("input", e => muda(e.target.value.split(",").map(s => s.trim()).filter(Boolean)));
  } else if (t === "cor") {
    wrap.innerHTML = `<label for="${id}">${esc(c.r)}</label><div class="cor"><input type="color" id="${id}" value="${esc(val)}"><button class="btn btn-pequeno" type="button">Voltar à cor original</button></div>`;
    const inp = wrap.querySelector("input");
    inp.addEventListener("input", e => muda(e.target.value));
    wrap.querySelector("button").addEventListener("click", () => { inp.value = pegar(padrao, caminho); muda(inp.value); });
  } else if (t === "logo") {
    wrap.innerHTML = `<span style="font-weight:700">${esc(c.r)}</span><div class="logo-campo"><img alt="Logo atual" src="${val || "logo.png"}">
      <label class="btn btn-pequeno">Trocar logo<input type="file" accept="image/*" class="oculto"></label>
      <button class="btn btn-pequeno" type="button">Usar logo original</button></div>`;
    const img = wrap.querySelector("img");
    wrap.querySelector("input").addEventListener("change", async e => {
      const f = e.target.files[0]; if (!f) return;
      const url = await reduzir(f, 400, "image/png", 0.92); img.src = url; muda(url);
    });
    wrap.querySelector("button").addEventListener("click", () => { img.src = "logo.png"; muda(""); });
  } else if (t === "rep") {
    return criarRepetidor(c, alvo, caminho);
  }
  return wrap;
}

function criarRepetidor(c, alvo, caminho){
  const box = document.createElement("div");
  const desenhar = () => {
    const lista = pegar(alvo, caminho) || [];
    box.innerHTML = "";
    lista.forEach((item, i) => {
      const el = document.createElement("div"); el.className = "item";
      el.innerHTML = `<div class="item-topo"><b>${esc(item.titulo || c.r + " " + (i + 1))}</b>
        <button class="btn btn-pequeno" type="button" data-m="-1" ${i === 0 ? "disabled" : ""} aria-label="Mover para cima">↑</button>
        <button class="btn btn-pequeno" type="button" data-m="1" ${i === lista.length - 1 ? "disabled" : ""} aria-label="Mover para baixo">↓</button>
        <button class="btn btn-pequeno btn-perigo" type="button" data-x>Remover</button></div>`;
      c.sub.forEach(s => el.appendChild(criarCampo(s, item, s.k)));
      el.querySelector("[data-x]").addEventListener("click", () => {
        if (!confirm(`Remover "${item.titulo || c.r}"?`)) return;
        lista.splice(i, 1); marcarAlterado(); desenhar();
      });
      el.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
        const j = i + Number(b.dataset.m); [lista[i], lista[j]] = [lista[j], lista[i]]; marcarAlterado(); desenhar();
      }));
      box.appendChild(el);
    });
    const add = document.createElement("button");
    add.type = "button"; add.className = "btn"; add.textContent = "Adicionar " + c.r.toLowerCase();
    add.addEventListener("click", () => { lista.push(structuredClone(c.novo)); pôr(alvo, caminho, lista); marcarAlterado(); desenhar(); });
    box.appendChild(add);
  };
  desenhar();
  return box;
}

/* ---------- Salvar ---------- */
$("#salvar").addEventListener("click", async () => {
  const b = $("#salvar"); b.disabled = true; b.textContent = "Salvando…";
  try {
    await db.collection(COL.conteudo).doc("conteudo").set({
      ...dados, atualizadoEm: new Date().toISOString(), atualizadoPor: auth.currentUser.email
    });
    salvoJSON = JSON.stringify(dados); aviso("Alterações salvas. O site já está atualizado.");
  } catch(e) {
    aviso(e.code === "permission-denied" ? "Sem permissão para salvar. Confira as regras do Firestore." : "Não foi possível salvar: " + e.message);
  }
  b.textContent = "Salvar alterações"; marcarAlterado();
});
$("#descartar").addEventListener("click", () => {
  if (!confirm("Desfazer tudo o que não foi salvo?")) return;
  dados = JSON.parse(salvoJSON); mostrar(abaAtual); marcarAlterado();
});

/* ---------- Imagens ---------- */
function carregarImagem(file){
  return new Promise((ok, falha) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error("Arquivo de imagem inválido")); };
    img.src = url;
  });
}
async function reduzir(file, lado, tipo, qualidade, limite){
  const img = await carregarImagem(file);
  let escala = Math.min(1, lado / Math.max(img.width, img.height)), q = qualidade, out;
  for (let tentativa = 0; tentativa < 6; tentativa++) {
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.width * escala); cv.height = Math.round(img.height * escala);
    const ctx = cv.getContext("2d");
    if (tipo !== "image/png") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); }
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    out = cv.toDataURL(tipo, q);
    if (tipo === "image/webp" && !out.startsWith("data:image/webp")) { tipo = "image/jpeg"; out = cv.toDataURL(tipo, q); }
    if (!limite || out.length <= limite) break;
    q = Math.max(0.5, q - 0.08); escala *= 0.85;
  }
  return out;
}

/* ---------- Fotos ---------- */
let fotos = [];
async function montarFotos(p){
  p.insertAdjacentHTML("beforeend", `
    <label class="soltar" id="soltar">
      <b>Adicionar fotos</b>
      <span>Toque para escolher ou arraste as fotos para cá. Pode escolher várias de uma vez.</span>
      <input type="file" accept="image/*" multiple class="oculto" id="arquivos">
    </label>
    <div class="progresso oculto" id="progresso" role="status" aria-live="polite"></div>
    <div class="fotos" id="lista-fotos"><p class="vazio">Carregando fotos…</p></div>`);
  const zona = $("#soltar");
  ["dragenter","dragover"].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add("sobre"); }));
  ["dragleave","drop"].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.remove("sobre"); }));
  zona.addEventListener("drop", e => enviar([...e.dataTransfer.files].filter(f => f.type.startsWith("image/"))));
  $("#arquivos").addEventListener("change", e => { enviar([...e.target.files]); e.target.value = ""; });
  try {
    const snap = await db.collection(COL.fotos).orderBy("ordem").get();
    fotos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e){ fotos = []; aviso("Não consegui carregar as fotos: " + e.message); }
  desenharFotos();
}

async function enviar(arquivos){
  if (!arquivos.length) return;
  const prog = $("#progresso"); prog.classList.remove("oculto");
  let base = fotos.length ? Math.max(...fotos.map(f => f.ordem || 0)) + 1 : 1;
  for (let i = 0; i < arquivos.length; i++) {
    prog.textContent = `Enviando foto ${i + 1} de ${arquivos.length}…`;
    try {
      const grande = await reduzir(arquivos[i], 1600, "image/webp", 0.82, 900000);
      const mini = await reduzir(arquivos[i], 520, "image/webp", 0.72, 120000);
      const ref = db.collection(COL.fotos).doc();
      const lote = db.batch();
      const meta = { mini, legenda: "", ordem: base++, visivel: true, criadoEm: new Date().toISOString(), criadoPor: auth.currentUser.email };
      lote.set(ref, meta);
      lote.set(db.collection(COL.fotosFull).doc(ref.id), { dados: grande });
      await lote.commit();
      fotos.push({ id: ref.id, ...meta });
      if (abaAtual === "fotos") desenharFotos();
    } catch(e) {
      aviso(`Erro na foto ${arquivos[i].name}: ` + (e.code === "permission-denied" ? "sem permissão" : e.message));
    }
  }
  prog.textContent = "Fotos enviadas. Elas já aparecem no site.";
  setTimeout(() => prog.classList.add("oculto"), 4000);
}

function desenharFotos(){
  const box = $("#lista-fotos"); if (!box) return;
  if (!fotos.length) { box.innerHTML = `<p class="vazio">Nenhuma foto ainda. A galeria aparece no site assim que você enviar a primeira.</p>`; return; }
  box.innerHTML = fotos.map((f, i) => `
    <div class="foto${f.visivel === false ? " escondida" : ""}" data-id="${f.id}">
      <img src="${f.mini}" alt="${esc(f.legenda)}" loading="lazy">
      <div class="in">
        <input type="text" placeholder="Legenda (opcional)" aria-label="Legenda da foto ${i + 1}" value="${esc(f.legenda)}" data-legenda>
        <label class="check"><input type="checkbox" data-visivel ${f.visivel !== false ? "checked" : ""}> Aparece no site</label>
        <div class="linha">
          <button class="btn btn-pequeno" type="button" data-m="-1" ${i === 0 ? "disabled" : ""} aria-label="Mover para antes">←</button>
          <button class="btn btn-pequeno" type="button" data-m="1" ${i === fotos.length - 1 ? "disabled" : ""} aria-label="Mover para depois">→</button>
          <button class="btn btn-pequeno btn-perigo" type="button" data-x style="margin-left:auto">Excluir</button>
        </div>
      </div>
    </div>`).join("");
}

document.addEventListener("change", async e => {
  const card = e.target.closest(".foto"); if (!card) return;
  const f = fotos.find(x => x.id === card.dataset.id);
  try {
    if (e.target.matches("[data-legenda]")) { f.legenda = e.target.value.trim(); await db.collection(COL.fotos).doc(f.id).update({ legenda: f.legenda }); aviso("Legenda salva."); }
    if (e.target.matches("[data-visivel]")) { f.visivel = e.target.checked; await db.collection(COL.fotos).doc(f.id).update({ visivel: f.visivel }); card.classList.toggle("escondida", !f.visivel); aviso(f.visivel ? "A foto voltou para o site." : "A foto foi escondida do site."); }
  } catch(err){ aviso("Não foi possível salvar: " + err.message); }
});
document.addEventListener("click", async e => {
  const card = e.target.closest(".foto"); if (!card) return;
  const i = fotos.findIndex(x => x.id === card.dataset.id), f = fotos[i];
  if (e.target.closest("[data-x]")) {
    if (!confirm("Excluir esta foto do site? Isso não pode ser desfeito.")) return;
    try {
      const lote = db.batch(); lote.delete(db.collection(COL.fotos).doc(f.id)); lote.delete(db.collection(COL.fotosFull).doc(f.id)); await lote.commit();
      fotos.splice(i, 1); desenharFotos(); aviso("Foto excluída.");
    } catch(err){ aviso("Não foi possível excluir: " + err.message); }
  }
  const m = e.target.closest("[data-m]");
  if (m) {
    const j = i + Number(m.dataset.m), g = fotos[j];
    [f.ordem, g.ordem] = [g.ordem, f.ordem]; [fotos[i], fotos[j]] = [g, f];
    desenharFotos();
    try {
      const lote = db.batch();
      lote.update(db.collection(COL.fotos).doc(f.id), { ordem: f.ordem });
      lote.update(db.collection(COL.fotos).doc(g.id), { ordem: g.ordem });
      await lote.commit();
    } catch(err){ aviso("Não foi possível mudar a ordem: " + err.message); }
  }
});
})();
</script>
